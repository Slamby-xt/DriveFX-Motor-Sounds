<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Admin</title>
<style>
:root{--bg:#05070d;--card:#0c1220;--line:#1c2740;--tx:#e8f1ff;--mute:#7f90ad;--ac:#00e5ff;--ok:#27f0a0;--err:#ff6b7f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 70% -10%,#0d2a3a 0,transparent 60%),var(--bg);color:var(--tx);font:500 16px/1.45 system-ui,Segoe UI,sans-serif;padding:28px 16px}
.w{max-width:820px;margin:0 auto}h1{font-size:22px;letter-spacing:.12em;margin:0 0 4px}h1 b{color:var(--ac)}.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 0 40px -18px var(--ac)}
label{display:block;font-size:12px;letter-spacing:.16em;color:var(--mute);margin-bottom:8px}
input[type=text],input[type=number]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#060a14;color:var(--tx);font:700 18px ui-monospace,Consolas,monospace;letter-spacing:.06em}
.mask{-webkit-text-security:disc;text-security:disc}#id{text-transform:uppercase;font-size:20px}input:focus{outline:2px solid var(--ac)}
.idrow{display:flex;gap:8px}.idrow input{flex:1;min-width:0}.pasteBtn{padding:0 18px;border-radius:12px;border:1px solid var(--ac);background:rgba(0,229,255,.1);color:var(--ac);font:800 13px inherit;letter-spacing:.12em;cursor:pointer}
.plans{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.plans button{flex:1;min-width:92px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0a1020;color:var(--tx);font:700 14px inherit;cursor:pointer}
.plans button.on{border-color:var(--ac);background:rgba(0,229,255,.12);color:var(--ac)}
.opt{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--mute);font-size:14px}.opt input{width:18px;height:18px}
.go{width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:var(--ac);color:#04121a;font:800 15px inherit;letter-spacing:.14em;cursor:pointer}
.go:hover{filter:brightness(1.1)}.go[disabled]{opacity:.5;cursor:wait}.msg{margin-top:12px;min-height:20px;color:var(--err);font-weight:600}.msg.ok{color:var(--ok)}
.hide{display:none!important}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;letter-spacing:.14em;color:var(--mute);text-align:left;padding:6px 8px}
td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}td.id{font:700 14px ui-monospace,Consolas,monospace;white-space:nowrap}
td button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0a1020;color:var(--tx);cursor:pointer;margin:2px 2px 2px 0;font:600 12px inherit}td button.d{color:var(--err);border-color:rgba(255,107,127,.4)}
.tag{padding:3px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}.tag.on{background:rgba(39,240,160,.15);color:var(--ok)}.tag.off{background:rgba(255,107,127,.15);color:var(--err)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.lock{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#0a1020;color:var(--tx);font:700 12px inherit;letter-spacing:.12em;cursor:pointer}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{font-size:15px;padding:10px}.bar button{padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#0a1020;color:var(--tx);cursor:pointer;font:700 12px inherit}
</style></head><body><div class="w">
<div class="top"><div><h1>DRIVE<b>FX</b> · ADMIN</h1><p class="sub" id="sub">Locked.</p></div><button class="lock hide" id="lock">LOCK</button></div>

<div class="card" id="gate">
  <label>PASSWORD</label><input type="text" id="pw" class="mask" name="adm-k" placeholder="Enter admin password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
  <button class="go" id="unlock">UNLOCK</button><div class="msg" id="gmsg"></div>
</div>

<div id="app" class="hide">
  <div class="card"><label>CUSTOMER ID</label>
    <div class="idrow"><input type="text" id="id" name="cust-ref" placeholder="DFX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other"><button type="button" id="pasteBtn" class="pasteBtn">PASTE</button></div>
    <div class="plans" id="plans"></div>
    <div id="customBox" class="hide" style="margin-top:10px"><label>NUMBER OF DAYS</label><input type="number" id="custom" min="1" max="3650" value="30"></div>
    <label class="opt"><input type="checkbox" id="extend"> Add to the current subscription instead of starting from today</label>
    <button class="go" id="go">ACTIVATE</button><div class="msg" id="msg"></div></div>
  <div class="card"><label>CANCEL A SUBSCRIPTION</label>
    <div class="idrow"><input type="text" id="rid" name="cancel-ref" placeholder="DFX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other" style="text-transform:uppercase;font-size:20px"><button type="button" id="rPaste" class="pasteBtn">PASTE</button></div>
    <button class="go" id="rGo" style="background:var(--err)">CANCEL SUBSCRIPTION</button><div class="msg" id="rmsg"></div></div>
  <div class="card"><label>SUBSCRIPTIONS</label>
    <div class="bar"><input type="text" id="q" placeholder="Search ID…" autocomplete="off" data-lpignore="true" data-1p-ignore><button id="refresh">REFRESH</button></div>
    <table><thead><tr><th>ID</th><th>PLAN</th><th>STATUS</th><th></th></tr></thead><tbody id="hist"></tbody></table></div>
</div></div>
<script>
(() => {
const API = 'https://drivefx-licenses.xtdanik.workers.dev', IDLE = 10 * 60 * 1000;
const $ = s => document.querySelector(s);
let token = null, idleT = null, items = [];

// ---------- talking to the license server ----------
async function api(path, body) {
  const r = await fetch(API + path, { method: body ? 'POST' : 'GET', headers: { 'X-Admin-Token': token || '', ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.error || 'Server error'); e.status = r.status; throw e; }
  return j;
}

// ---------- unlock ----------
async function unlock() {
  const pw = $('#pw').value.trim(); if (!pw) return;
  const btn = $('#unlock'); btn.disabled = true; $('#gmsg').style.color = 'var(--mute)'; $('#gmsg').textContent = 'Checking…';
  token = pw;
  try {
    await load();
    $('#pw').value = ''; $('#gate').classList.add('hide'); $('#app').classList.remove('hide'); $('#lock').classList.remove('hide');
    $('#sub').textContent = 'Unlocked. Locks itself after 10 minutes of inactivity.'; $('#id').focus(); bump();
  } catch (e) {
    token = null; $('#gmsg').style.color = 'var(--err)';
    $('#gmsg').textContent = e.status === 401 || e.status === 429 ? e.message : 'Cannot reach the license server.';
  }
  btn.disabled = false;
}
function lock() { token = null; items = []; $('#app').classList.add('hide'); $('#lock').classList.add('hide'); $('#gate').classList.remove('hide'); $('#sub').textContent = 'Locked.'; $('#gmsg').textContent = ''; $('#pw').focus(); }
function bump() { clearTimeout(idleT); idleT = setTimeout(lock, IDLE); }
['pointerdown', 'keydown'].forEach(e => addEventListener(e, () => token && bump()));
$('#unlock').onclick = unlock; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); }); $('#lock').onclick = lock;

// ---------- ID parsing (forgiving) ----------
const LOOK = { 'А': 'A', 'В': 'B', 'Е': 'E', 'К': 'K', 'М': 'M', 'Н': 'H', 'О': 'O', 'Р': 'P', 'С': 'C', 'Т': 'T', 'Х': 'X', 'У': 'Y' };
function normId(s) {
  s = String(s || '').toUpperCase().replace(/[АВЕКМНОРСТХУ]/g, c => LOOK[c]).replace(/[‐-―−]/g, '-');
  const m = s.match(/DFX[^A-Z0-9]*([A-Z0-9]{4})[^A-Z0-9]*([A-Z0-9]{4})/);
  return m ? `DFX-${m[1]}-${m[2]}` : s.trim();
}
$('#id').addEventListener('paste', e => { const t = (e.clipboardData || window.clipboardData).getData('text'); e.preventDefault(); $('#id').value = normId(t); $('#msg').textContent = ''; });
$('#id').addEventListener('blur', () => { $('#id').value = normId($('#id').value); });
$('#id').addEventListener('input', () => { const v = $('#id').value, n = normId(v); if (n !== v && /^DFX-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(n)) $('#id').value = n; });
$('#pasteBtn').onclick = async () => {
  try { $('#id').value = normId(await navigator.clipboard.readText()); $('#msg').textContent = ''; $('#id').focus(); }
  catch { setMsg('Browser blocked the clipboard — long-press / right-click the field and choose Paste.', false); $('#id').focus(); }
};

// ---------- plans + activate ----------
const PLANS = [['7 days', 7], ['30 days', 30], ['90 days', 90], ['1 year', 365], ['Lifetime', 0], ['Custom', 'c']]; let plan = 30;
$('#plans').innerHTML = PLANS.map(([t, v]) => `<button data-v="${v}" class="${v === 30 ? 'on' : ''}">${t}</button>`).join('');
$('#plans').onclick = e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#plans button').forEach(x => x.classList.remove('on')); b.classList.add('on'); plan = b.dataset.v === 'c' ? 'c' : +b.dataset.v; $('#customBox').classList.toggle('hide', plan !== 'c'); };
const fmtPlan = d => d ? d + ' days' : 'Lifetime';
function setMsg(t, ok) { const m = $('#msg'); m.textContent = t; m.className = 'msg' + (ok ? ' ok' : ''); }
async function activate() {
  if (!token) return lock();
  const id = normId($('#id').value); $('#id').value = id;
  if (!/^DFX-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(id)) return setMsg('ID must look like DFX-XXXX-XXXX.', false);
  const days = plan === 'c' ? +$('#custom').value : plan;
  if (plan === 'c' && !(Number.isInteger(days) && days > 0 && days <= 3650)) return setMsg('Enter a whole number of days (1–3650).', false);
  const btn = $('#go'); btn.disabled = true;
  try {
    const r = await api('/grant', { id, days, mode: $('#extend').checked ? 'extend' : 'set' });
    setMsg(`Done: ${id} is active ${r.exp ? 'until ' + new Date(r.exp * 1000).toLocaleDateString() : '(lifetime)'}. The customer's page unlocks by itself.`, true);
    $('#id').value = ''; await load();
  } catch (e) { if (e.status === 401) return lock(); setMsg(e.message, false); }
  btn.disabled = false;
}
$('#go').onclick = activate; $('#id').addEventListener('keydown', e => { if (e.key === 'Enter') activate(); });

// ---------- subscriptions list ----------
function status(r, now) { if (!r.exp) return '<span class="tag on">Lifetime</span>'; const left = Math.ceil((r.exp - now) / 86400); return left > 0 ? `<span class="tag on">${left} day${left === 1 ? '' : 's'} left</span>` : '<span class="tag off">Expired</span>'; }
let nowTs = Math.floor(Date.now() / 1000);
function render() {
  const q = normId($('#q').value).replace(/^DFX-?/, '').toUpperCase(), raw = $('#q').value.trim().toUpperCase();
  const list = items.filter(x => !raw || x.id.includes(raw) || (q && x.id.includes(q)));
  $('#hist').innerHTML = list.length ? list.map(x => `<tr><td class="id">${x.id}</td><td>${fmtPlan(x.days)}<br><small style="color:var(--mute)">${new Date(x.iat * 1000).toLocaleDateString()}</small></td><td>${status(x, nowTs)}</td>
    <td><button data-a="ext" data-id="${x.id}">+30 days</button><button class="d" data-a="rev" data-id="${x.id}">Revoke</button></td></tr>`).join('') : `<tr><td colspan="4" style="color:var(--mute)">${items.length ? 'No match.' : 'No subscriptions yet.'}</td></tr>`;
}
async function load() { const r = await api('/list'); items = r.items; nowTs = r.now; render(); }
$('#q').addEventListener('input', render); $('#refresh').onclick = () => load().catch(e => e.status === 401 && lock());
$('#hist').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return; const id = b.dataset.id;
  try {
    if (b.dataset.a === 'rev') { if (!confirm('Cancel the subscription for ' + id + '?')) return; await api('/revoke', { id }); }
    else await api('/grant', { id, days: 30, mode: 'extend' });
    await load();
  } catch (err) { if (err.status === 401) lock(); else alert(err.message); }
};
// ---------- cancel by ID ----------
function rMsg(t, ok) { const m = $('#rmsg'); m.textContent = t; m.className = 'msg' + (ok ? ' ok' : ''); }
$('#rid').addEventListener('paste', e => { const t = (e.clipboardData || window.clipboardData).getData('text'); e.preventDefault(); $('#rid').value = normId(t); rMsg('', true); });
$('#rid').addEventListener('blur', () => { $('#rid').value = normId($('#rid').value); });
$('#rPaste').onclick = async () => { try { $('#rid').value = normId(await navigator.clipboard.readText()); rMsg('', true); } catch { rMsg('Browser blocked the clipboard — paste into the field manually.', false); } $('#rid').focus(); };
async function cancelSub() {
  if (!token) return lock();
  const id = normId($('#rid').value); $('#rid').value = id;
  if (!/^DFX-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(id)) return rMsg('ID must look like DFX-XXXX-XXXX.', false);
  if (!confirm('Cancel the subscription for ' + id + '? It stops working on their device right away.')) return;
  const btn = $('#rGo'); btn.disabled = true;
  try { await api('/revoke', { id }); rMsg(`Done: the subscription for ${id} is cancelled.`, true); $('#rid').value = ''; await load(); }
  catch (e) { if (e.status === 401) return lock(); rMsg(e.message, false); }
  btn.disabled = false;
}
$('#rGo').onclick = cancelSub; $('#rid').addEventListener('keydown', e => { if (e.key === 'Enter') cancelSub(); });
$('#pw').focus();
})();
</script></body></html>
